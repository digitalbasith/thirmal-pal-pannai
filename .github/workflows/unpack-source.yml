name: Unpack project source

on:
  push:
    branches: [main]
    paths:
      - 'thirumal-paal-pannai-client-v5.4.1-deploy-fix.tar.gz'
      - '.github/workflows/unpack-source.yml'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract application source
        shell: bash
        run: |
          set -e
          test -f thirumal-paal-pannai-client-v5.4.1-deploy-fix.tar.gz
          tar -xzf thirumal-paal-pannai-client-v5.4.1-deploy-fix.tar.gz --strip-components=1
          rm -f thirumal-paal-pannai-client-v5.4.1-deploy-fix.tar.gz
          rm -f package.v51.json tsconfig.app.tsbuildinfo
          printf 'node_modules/\ndist/\n.env\n.vercel/\n*.log\n.DS_Store\n*.tsbuildinfo\n' > .gitignore
      - name: Commit extracted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Add Thirumal Paal Pannai V5.4.1 source"
          git push
